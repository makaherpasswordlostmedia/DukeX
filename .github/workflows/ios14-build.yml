name: DukeX iOS 14 (unsigned .ipa)

# ONE-FILE DROP-IN. Put this single file at  .github/workflows/ios14-build.yml
# on the DEFAULT branch of your repo (repo root = the folder that contains
# `ios/`, `meson.build`, `configure`). Then:
#   Actions -> "DukeX iOS 14 (unsigned .ipa)" -> Run workflow.
#
# All 36 file changes of the iOS 14.6 / iPhone 8 port are embedded below as a
# gzip+base64 unified diff, so nothing else has to be copied anywhere. The first
# step applies it (idempotent: skipped if your tree is already patched).
#
# Lessons reused from the Crash Bandicoot iOS workflow:
#   - catch compile errors FIRST with a cheap simulator build (no signing);
#   - only then spend time on the heavy native core + device build;
#   - package an UNSIGNED .ipa by hand (zip Payload/), re-sign on install;
#   - always upload logs, even on failure, so a red run is actionable.
#
# Install the .ipa with AltStore / Sideloadly (re-signs it). On iOS 14.6 JIT must
# be enabled externally (AltStore "Enable JIT", SideJITServer, Jitterbug or a
# jailbreak) - StikDebug does not exist there.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "What to build"
        required: true
        type: choice
        default: full-ipa
        options:
          - full-ipa            # Swift check + xemu core + MoltenVK + .ipa
          - swift-check-only    # only the fast simulator compile of the Swift app
      moltenvk_version:
        description: "MoltenVK release tag (KhronosGroup/MoltenVK)"
        required: false
        default: "v1.3.0"
        type: string
      glib_max_version:
        description: "Newest glib to allow (picked automatically from the vcpkg version database)"
        required: false
        default: "2.76"
        type: string

permissions:
  contents: read

concurrency:
  group: dukex-ios14-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_DEPLOYMENT_TARGET: "14.0"
  VCPKG_DISABLE_METRICS: "1"

jobs:
  build:
    name: Build DukeX for iOS 14 (arm64)
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Apply iOS 14 port (embedded patch, 36 files)
        run: |
          set -euo pipefail
          mkdir -p logs

          # 1) Find the project root (the folder that holds ios/DukeX/DukeX.xcodeproj).
          #    If the repo has it nested (e.g. DukeX-master/...), hoist it to the repo root,
          #    because the xemu build needs ONE no-space checkout root.
          echo "Workspace: $PWD"; ls -la | head -40
          PROJ="$(find . -maxdepth 4 -type d -path '*/ios/DukeX/DukeX.xcodeproj' -not -path './.git/*' | head -1)"
          if [ -z "$PROJ" ]; then
            echo "::error::ios/DukeX/DukeX.xcodeproj not found in this repo. Top-level layout:"
            find . -maxdepth 3 -not -path './.git/*' -type d | head -60
            exit 1
          fi
          ROOT="$(dirname "$(dirname "$(dirname "$PROJ")")")"
          echo "Project root detected: $ROOT"
          if [ "$ROOT" != "." ]; then
            echo "Hoisting $ROOT to the workspace root"
            TOP="$(echo "$ROOT" | cut -d/ -f2)"
            cp -a "$ROOT"/. .
            rm -rf "./$TOP"
          fi
          test -f meson.build && test -f ios/scripts/build-core-ios.sh

          # 2) Decode the embedded patch.
          cat <<'PATCH_EOF' | base64 -d | gunzip > "$RUNNER_TEMP/ios14.patch"
