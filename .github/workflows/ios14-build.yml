          grep -n 'IOS_DEPLOYMENT_TARGET:-' ios/scripts/build-core-ios.sh
          grep -c "iOS14Compat.swift" ios/DukeX/DukeX.xcodeproj/project.pbxproj

      - name: iOS 14 runtime fix - guard CAMetalLayer developer HUD (ObjC core)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          p = "ui/xemu-os-utils-ios.m"
          t = open(p, encoding="utf-8").read()
          old = "    layer.developerHUDProperties = properties;\n"
          new = ("    /* developerHUDProperties exists on iOS 16+ only; on iOS 14/15 the setter\n"
                 "     * is an unrecognized selector and aborts the whole app. */\n"
                 "    if (![layer respondsToSelector:@selector(setDeveloperHUDProperties:)]) {\n"
                 "        return;\n"
                 "    }\n"
                 "    layer.developerHUDProperties = properties;\n")
          if new in t:
              print("already guarded")
          elif t.count(old) == 1:
              open(p, "w", encoding="utf-8").write(t.replace(old, new))
              print("guarded developerHUDProperties in", p)
          else:
              sys.exit("xemu-os-utils-ios.m layout changed - HUD guard did not apply")
          PY
          grep -n -B1 -A3 "respondsToSelector:@selector(setDeveloperHUDProperties" ui/xemu-os-utils-ios.m

      - name: Select Xcode
        run: |
          set -e
          for v in 16.4 16.3 16.2 16.1 16.0 15.4 15.3; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_${v}.app/Contents/Developer"
              echo "Selected Xcode ${v}"
              break
            fi
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # ---- Step 1: fast fail. Swift sources only, simulator, no signing, no core.
      - name: Swift compile check (iOS Simulator, Debug)
        run: |
          set -eo pipefail
          mkdir -p logs
          set +e
          xcodebuild \
            -project ios/DukeX/DukeX.xcodeproj -scheme DukeX \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee logs/swift-sim.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Swift simulator build FAILED - see error list below and logs/swift-sim.log artifact"
            {
              echo "### Swift compile errors"
              echo '```'
              grep -E "error:" logs/swift-sim.log | sed -E 's#^.*/ios/#ios/#' | sort -u | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:" logs/swift-sim.log | sort -u | head -40 || true
            exit 1
          fi
          echo "Swift simulator build OK"

      # ---- Step 2: heavy native part.
      - uses: actions/setup-python@v5
        if: inputs.stage == 'full-ipa'
        with:
          python-version: "3.12"

      - name: Install host tools
        if: inputs.stage == 'full-ipa'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install ninja pkg-config cmake autoconf autoconf-archive automake libtool nasm glib gettext
          python3 -m pip install --quiet pyyaml setuptools
          echo "$(brew --prefix glib)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Cache vcpkg binary packages
        if: inputs.stage == 'full-ipa'
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-arm64-ios14-${{ hashFiles('.github/workflows/ios14-build.yml') }}-${{ inputs.glib_max_version }}
          restore-keys: vcpkg-arm64-ios14-

      - name: vcpkg arm64-ios dependencies (deployment target 14.0)
        if: inputs.stage == 'full-ipa'
        env:
          GLIB_MAX: ${{ inputs.glib_max_version }}
        run: |
          set -uo pipefail
          mkdir -p logs "$HOME/.cache/vcpkg/archives"
          # Full clone: manifest "overrides" need the version database history.
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          BASELINE="$(git -C "$HOME/vcpkg" rev-parse HEAD)"

          # Overlay triplet: same name as the community one, pinned to iOS 14.0.
          mkdir -p "$HOME/triplets"
          cat > "$HOME/triplets/arm64-ios.cmake" <<'TRIPLET'
          set(VCPKG_TARGET_ARCHITECTURE arm64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_CMAKE_SYSTEM_NAME iOS)
          set(VCPKG_OSX_SYSROOT iphoneos)
          set(VCPKG_OSX_DEPLOYMENT_TARGET 14.0)
          set(VCPKG_C_FLAGS "-miphoneos-version-min=14.0")
          set(VCPKG_CXX_FLAGS "-miphoneos-version-min=14.0")
          TRIPLET
          sed -i '' -E 's/^ {10}//' "$HOME/triplets/arm64-ios.cmake"

          # Manifest: libepoxy WITHOUT default features (egl/x11 do not build on iOS; xemu only
          # needs epoxy's GL headers, rendering goes through Vulkan/MoltenVK). glib is pinned to
          # the newest version <= GLIB_MAX found in vcpkg's own version database, including its
          # port-version (entries look like 2.82.2#1).
          mkdir -p "$HOME/manifest"
          BASELINE="$BASELINE" GLIB_MAX="$GLIB_MAX" python3 - <<'PY'
          import json, os, re, pathlib, subprocess
          root = os.path.expanduser("~/vcpkg")
          entries = json.load(open(os.path.join(root, "versions", "g-", "glib.json")))["versions"]
          def ver(e):
              return e.get("version") or e.get("version-semver") or e.get("version-string") or e.get("version-date")
          def key(v):
              return tuple(int(x) for x in re.findall(r"\d+", v.split("-")[0])[:3])
          limit = tuple(int(x) for x in os.environ["GLIB_MAX"].split("."))
          print("glib versions in database (newest first):", [f"{ver(e)}#{e.get('port-version', 0)}" for e in entries[:16]])
          chosen = next((e for e in entries if key(ver(e))[:len(limit)] <= limit), None)
          if chosen is None:
              raise SystemExit("no glib <= %s in the vcpkg version database" % os.environ["GLIB_MAX"])
          print("glib chosen:", ver(chosen), "port-version", chosen.get("port-version", 0), "git-tree", chosen["git-tree"])

          # Extract exactly that port version into an overlay port and patch it.
          ov = pathlib.Path(os.path.expanduser("~/overlay-ports/glib"))
          ov.mkdir(parents=True, exist_ok=True)
          tar = subprocess.run(["git", "-C", root, "archive", chosen["git-tree"]], stdout=subprocess.PIPE, check=True).stdout
          subprocess.run(["tar", "-x", "-C", str(ov)], input=tar, check=True)
          pf = ov / "portfile.cmake"
          s = pf.read_text()
          helper = r"""
          import os, sys
          path, prefix = sys.argv[1], sys.argv[2]
          sub = os.path.join(os.path.dirname(path), "subprojects", "proxy-libintl")
          os.makedirs(sub, exist_ok=True)
          text = (
              "project('proxy-libintl', 'c', version : '0.4')\n"
              "libintl_dep = declare_dependency(\n"
              "  compile_args: ['-I%s/include'],\n"
              "  link_args: ['-L%s/lib', '-L%s/debug/lib', '-lintl', '-liconv', '-lcharset', '-Wl,-framework,CoreFoundation'],\n"
              ")\n"
              "intl_dep = libintl_dep\n"
          ) % (prefix, prefix, prefix)
          open(os.path.join(sub, "meson.build"), "w", encoding="utf-8").write(text)
          print("proxy-libintl stub written to", sub)

          # gnulib: turn the "... missing or broken beyond repair" errors into warnings. Those probes
          # RUN test binaries, which is impossible for an iOS arm64 binary on the macOS build host.
          gn = os.path.join(os.path.dirname(path), "glib", "gnulib", "meson.build")
          if os.path.exists(gn):
              g = open(gn, encoding="utf-8").read()
              phrase = "missing or broken beyond repair"
              count = 0
              pos = 0
              while True:
                  k = g.find(phrase, pos)
                  if k < 0:
                      break
                  e = g.rfind("error", 0, k)
                  if e >= 0 and g[e:e + 5] == "error" and not g[e - 1:e].isalnum():
                      g = g[:e] + "warning" + g[e + 5:]
                      k += 2
                      count += 1
                  pos = k + len(phrase)
              open(gn, "w", encoding="utf-8").write(g)
              print("gnulib error->warning replacements:", count)
          else:
              print("gnulib meson.build not found at", gn)

          # gspawn.c: <libproc.h> (proc_pidinfo) exists in the macOS SDK only, not in iPhoneOS.sdk.
          # It is just an fd-enumeration shortcut inside safe_fdwalk(); the plain
          # "for fd < open_max" loop right below it is the portable fallback, so compile the
          # libproc branch out on iOS.
          gs = os.path.join(os.path.dirname(path), "glib", "gspawn.c")
          if os.path.exists(gs):
              t = open(gs, encoding="utf-8").read()
              n = 0
              a = "#include <libproc.h>"
              if a in t:
                  t = t.replace(a, "#include <TargetConditionals.h>\n#if !TARGET_OS_IPHONE\n#include <libproc.h>\n#endif")
                  n += 1
              c = "#include <sys/proc_info.h>"
              if c in t:
                  t = t.replace(c, "#if !TARGET_OS_IPHONE\n#include <sys/proc_info.h>\n#endif")
                  n += 1
              b = "#if defined(__APPLE__)\n  /* proc_pidinfo isn't documented"
              if b in t:
                  t = t.replace(b, "#if defined(__APPLE__) && !TARGET_OS_IPHONE\n  /* proc_pidinfo isn't documented")
                  n += 1
              open(gs, "w", encoding="utf-8").write(t)
              print("gspawn.c libproc replacements:", n, "(expected 3)")
              if n != 3:
                  sys.exit("gspawn.c layout changed - libproc patch did not apply")
          else:
              sys.exit("gspawn.c not found at " + gs)
          """
          pathlib.Path(os.path.expanduser("~/glib_intl_patch.py")).write_text(helper)

          hack = """
          # --- DukeX: iOS cross build ---
          # glib's gnulib check for frexpl() RUNS a test binary. An iOS arm64 binary cannot run on the
          # macOS build host, so meson wrongly concludes frexpl is broken and aborts. frexpl exists in
          # the iOS libm, so downgrade that error() to a warning().
          foreach(_q "'" "\\"")
              vcpkg_replace_string("${SOURCE_PATH}/glib/gnulib/meson.build"
                  "error(${_q}frexpl()" "warning(${_q}frexpl()" IGNORE_UNCHANGED)
          endforeach()
          # glib asks meson for dependency('intl'). In an iOS cross build meson's CMake probe fails
          # (empty VCPKG_TARGET_ARCHITECTURE in its sandbox) and the builtin/system probes find
          # nothing, so glib falls back to its proxy-libintl subproject, which vcpkg forbids to
          # download. Provide that subproject locally, backed by vcpkg's real static libintl.
          execute_process(
              COMMAND python3 "$ENV{HOME}/glib_intl_patch.py"
                      "${SOURCE_PATH}/meson.build" "${CURRENT_INSTALLED_DIR}"
              RESULT_VARIABLE _dukex_rc)
          if(NOT _dukex_rc EQUAL 0)
              message(FATAL_ERROR "DukeX: glib intl patch failed (${_dukex_rc})")
          endif()
          # --- end DukeX ---

          """
          i = s.index("vcpkg_configure_meson(")
          pf.write_text(s[:i] + hack + s[i:])
          print("overlay port ready:", sorted(x.name for x in ov.iterdir()))

          # libepoxy: vcpkg only disables GLX/EGL for Windows and macOS, so on iOS it builds the
          # X11/EGL dispatch code and fails ("unknown type name 'EGLDisplay'"). iOS has neither,
          # so treat it like macOS (-Dglx=no -Degl=no -Dx11=false).
          import shutil
          epx = pathlib.Path(os.path.expanduser("~/overlay-ports/libepoxy"))
          shutil.copytree(os.path.join(root, "ports", "libepoxy"), str(epx), dirs_exist_ok=True)
          epf = epx / "portfile.cmake"
          et = epf.read_text()
          eold = "if (VCPKG_TARGET_IS_WINDOWS OR VCPKG_TARGET_IS_OSX)"
          if eold not in et:
              raise SystemExit("libepoxy portfile layout changed - iOS patch did not apply")
          epf.write_text(et.replace(eold, "if (VCPKG_TARGET_IS_WINDOWS OR VCPKG_TARGET_IS_OSX OR VCPKG_TARGET_IS_IOS)"))
          print("libepoxy overlay port ready")

          manifest = {
              "name": "dukex-ios-deps",
              "version": "0.0.0",
              "builtin-baseline": os.environ["BASELINE"],
              "dependencies": [
                  "zlib", "libpng", "pixman", "glib", "libsamplerate",
                  {"name": "libepoxy", "default-features": False},
                  "sdl3", "curl",
              ],
          }
          json.dump(manifest, open(os.path.expanduser("~/manifest/vcpkg.json"), "w"), indent=2)

          PY
          sed -i '' -E 's/^ {10}//' "$HOME/manifest/vcpkg.json" 2>/dev/null || true
          cat "$HOME/manifest/vcpkg.json"

          export VCPKG_DEFAULT_BINARY_CACHE="$HOME/.cache/vcpkg/archives"
          "$HOME/vcpkg/vcpkg" install \
            --triplet arm64-ios \
            --overlay-triplets="$HOME/triplets" \
            --overlay-ports="$HOME/overlay-ports" \
            --x-manifest-root="$HOME/manifest" \
            --x-install-root="$HOME/vcpkg/installed" \
            --clean-after-build 2>&1 | tee logs/vcpkg.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::vcpkg install failed:"
            grep -E "^error:|BUILD_FAILED|no version database entry|version conflict|ERROR:" logs/vcpkg.log | sort -u | head -20
            mkdir -p logs/vcpkg-buildtrees
            find "$HOME/vcpkg/buildtrees" -name '*.log' -exec cp {} logs/vcpkg-buildtrees/ \; 2>/dev/null || true
            exit 1
          fi
          ls "$HOME/vcpkg/installed/arm64-ios/lib/pkgconfig" || true
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: MoltenVK (iOS headers + framework)
        if: inputs.stage == 'full-ipa'
        env:
          MVK_VER: ${{ inputs.moltenvk_version }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/mvk"
          curl -fL "https://github.com/KhronosGroup/MoltenVK/releases/download/${MVK_VER}/MoltenVK-ios.tar" -o "$HOME/mvk.tar"
          tar -xf "$HOME/mvk.tar" -C "$HOME/mvk"
          HDR="$(find "$HOME/mvk" -path '*include/vulkan/vulkan.h' | head -1)"
          FW="$(find "$HOME/mvk" -type d -path '*/ios-arm64/MoltenVK.framework' | head -1)"
          [ -n "$HDR" ] && [ -n "$FW" ] || { echo "::error::MoltenVK layout unexpected"; find "$HOME/mvk" -maxdepth 4; exit 1; }
          echo "MOLTENVK_ROOT=$(dirname "$(dirname "$(dirname "$HDR")")")" >> "$GITHUB_ENV"
          echo "MOLTENVK_FRAMEWORK=$FW" >> "$GITHUB_ENV"
          echo "Headers: $HDR"; echo "Framework: $FW"
          vtool -show-build "$FW/MoltenVK" 2>/dev/null | grep -E "platform|minos" || true

      - name: Build xemu core (libxemu-ios-core.dylib, iOS 14.0)
        if: inputs.stage == 'full-ipa'
        run: |
          set -eo pipefail
          export XEMU_IOS_VCPKG_PREFIX="$VCPKG_ROOT/installed/arm64-ios"
          # xemu's meson.build requires dependency('libpcap') via pkg-config, vcpkg has no libpcap
          # for iOS and the iPhoneOS SDK ships neither header nor library. Live packet capture can
          # never work inside the iOS sandbox anyway, so build a tiny stub libpcap (the subset of
          # the API that net/pcap.c and ui/xui/main-menu.cc use) and publish it via libpcap.pc.
          PCAPSTUB="$HOME/pcap-stub"
          rm -rf "$PCAPSTUB"; mkdir -p "$PCAPSTUB/include/pcap" "$PCAPSTUB/lib"
          sed 's/^    //' > "$PCAPSTUB/include/pcap/pcap.h" <<'PCAPH'
              #ifndef DUKEX_IOS_PCAP_STUB_H
              #define DUKEX_IOS_PCAP_STUB_H
              #include <sys/types.h>
              #include <sys/time.h>
              #ifdef __cplusplus
              extern "C" {
              #endif
              #define PCAP_ERRBUF_SIZE 256
              #define DLT_EN10MB 1
              typedef unsigned int bpf_u_int32;
              typedef struct pcap pcap_t;
              struct pcap_pkthdr { struct timeval ts; bpf_u_int32 caplen; bpf_u_int32 len; };
              struct pcap_addr;
              typedef struct pcap_if {
                  struct pcap_if *next;
                  char *name;
                  char *description;
                  struct pcap_addr *addresses;
                  bpf_u_int32 flags;
              } pcap_if_t;
              pcap_t *pcap_open_live(const char *device, int snaplen, int promisc, int to_ms, char *errbuf);
              void pcap_close(pcap_t *p);
              int pcap_sendpacket(pcap_t *p, const u_char *buf, int size);
              int pcap_next_ex(pcap_t *p, struct pcap_pkthdr **hdr, const u_char **data);
              char *pcap_geterr(pcap_t *p);
              int pcap_set_datalink(pcap_t *p, int dlt);
              int pcap_get_selectable_fd(pcap_t *p);
              int pcap_findalldevs(pcap_if_t **alldevsp, char *errbuf);
              void pcap_freealldevs(pcap_if_t *alldevs);
              #ifdef __cplusplus
              }
              #endif
              #endif
          PCAPH
          sed 's/^    //' > "$PCAPSTUB/pcap_stub.c" <<'PCAPC'
              #include <pcap/pcap.h>
              #include <stdio.h>
              #include <stddef.h>
              static void fail(char *errbuf) { if (errbuf) snprintf(errbuf, PCAP_ERRBUF_SIZE, "packet capture is not available on iOS"); }
              pcap_t *pcap_open_live(const char *d, int s, int p, int t, char *e) { (void)d; (void)s; (void)p; (void)t; fail(e); return NULL; }
              void pcap_close(pcap_t *p) { (void)p; }
              int pcap_sendpacket(pcap_t *p, const u_char *b, int n) { (void)p; (void)b; (void)n; return -1; }
              int pcap_next_ex(pcap_t *p, struct pcap_pkthdr **h, const u_char **d) { (void)p; (void)h; (void)d; return -1; }
              char *pcap_geterr(pcap_t *p) { (void)p; return (char *)"packet capture is not available on iOS"; }
              int pcap_set_datalink(pcap_t *p, int dlt) { (void)p; (void)dlt; return -1; }
              int pcap_get_selectable_fd(pcap_t *p) { (void)p; return -1; }
              int pcap_findalldevs(pcap_if_t **a, char *e) { if (a) *a = NULL; fail(e); return -1; }
              void pcap_freealldevs(pcap_if_t *a) { (void)a; }
          PCAPC
          SDKROOT_PCAP="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios14.0 -isysroot "$SDKROOT_PCAP" \
            -I"$PCAPSTUB/include" -fPIC -O1 -Wall -Werror -c "$PCAPSTUB/pcap_stub.c" -o "$PCAPSTUB/pcap_stub.o"
          xcrun --sdk iphoneos libtool -static -o "$PCAPSTUB/lib/libpcap.a" "$PCAPSTUB/pcap_stub.o"
          mkdir -p "$XEMU_IOS_VCPKG_PREFIX/lib/pkgconfig"
          printf 'Name: libpcap\nDescription: stub libpcap for iOS (no capture support)\nVersion: 1.10.1\nLibs: -L%s/lib -lpcap\nCflags: -I%s/include\n' \
            "$PCAPSTUB" "$PCAPSTUB" > "$XEMU_IOS_VCPKG_PREFIX/lib/pkgconfig/libpcap.pc"
          cat "$XEMU_IOS_VCPKG_PREFIX/lib/pkgconfig/libpcap.pc"
          chmod +x ios/scripts/*.sh
          set +e
          ios/scripts/build-core-ios.sh 2>&1 | tee logs/core.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::xemu core build FAILED (see logs/core.log)"
            tail -n 80 logs/core.log
            cp -f build-ios-arm64/meson-logs/meson-log.txt logs/meson-log.txt 2>/dev/null || true
            exit 1
          fi
          ls -la build-ios-arm64/libxemu-ios-core.dylib build-ios-arm64/subprojects/slirp/libslirp.0.dylib
          for f in build-ios-arm64/libxemu-ios-core.dylib build-ios-arm64/subprojects/slirp/libslirp.0.dylib; do
            echo "== $f"; vtool -show-build "$f" | grep -E "platform|minos|sdk" || true
          done

      - name: Build DukeX.app for device (Release, unsigned)
        if: inputs.stage == 'full-ipa'
        run: |
          set -eo pipefail
          set +e
          xcodebuild \
            -project ios/DukeX/DukeX.xcodeproj -scheme DukeX \
            -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            MOLTENVK_FRAMEWORK="$MOLTENVK_FRAMEWORK" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee logs/device.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Device build FAILED (see logs/device.log)"
            grep -E "error:" logs/device.log | sort -u | head -40 || true
            exit 1
          fi

      - name: Package unsigned .ipa
        if: inputs.stage == 'full-ipa'
        run: |
          set -euo pipefail
          APP="build/device/Build/Products/Release-iphoneos/DukeX.app"
          [ -d "$APP" ] || { echo "::error::DukeX.app not found"; find build/device -maxdepth 5 -name '*.app'; exit 1; }
          rm -rf ipa && mkdir -p ipa/Payload out
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "../out/DukeX-ios14-unsigned.ipa" Payload)
          unzip -l out/DukeX-ios14-unsigned.ipa | grep -E "Frameworks/(libxemu-ios-core|libslirp|MoltenVK)" || { echo "::error::core/MoltenVK missing from the .ipa"; exit 1; }
          plutil -p "$APP/Info.plist" | grep -E "MinimumOSVersion|CFBundleIdentifier" || true
          ls -la out

      - name: Upload .ipa
        if: inputs.stage == 'full-ipa' && success()
        uses: actions/upload-artifact@v4
        with:
          name: DukeX-ios14-unsigned-ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DukeX-ios14-build-logs
          path: |
            logs/
            build-ios-arm64/meson-logs/
          if-no-files-found: ignore
          retention-days: 14
